name: Build

on:
  push:
    branches: [main, teste]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Verificar versão
        id: ver
        run: |
          V=$(jq -r .version package.json)
          echo "v=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V já existe. Suba a versão no package.json."
            exit 1
          fi

      - name: Organizar arquivos
        run: |
          shopt -s nullglob
          mkdir -p src tests
          for f in *.ts *.tsx; do
            [ -f "$f" ] || continue
            mv -f "$f" src/
          done
          for f in *.test.cjs test_*.py check_direct_updater.py; do
            [ -f "$f" ] || continue
            mv -f "$f" tests/
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Organiza arquivos [skip ci]"
            git push
          fi

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar
        run: pnpm install --no-frozen-lockfile

      - name: Testar
        run: pnpm test

      - name: Compilar
        run: pnpm build

      - name: Empacotar
        run: |
          V="${{ steps.ver.outputs.v }}"
          mkdir -p out/NoLag
          cp -r dist out/NoLag/
          for f in main.py plugin.json package.json wifi_mgr.py wifi_dispatcher.py; do
            cp "$f" out/NoLag/
          done
          for f in LICENSE THIRD_PARTY_NOTICES.md README.md relay-code.txt; do
            [ -f "$f" ] && cp "$f" out/NoLag/ || true
          done
          (cd out && zip -qr "../NoLag-v$V.zip" NoLag)

      - name: Validar Direct Updater
        run: python3 tests/check_direct_updater.py

      - name: Publicar release
        run: |
          V="${{ steps.ver.outputs.v }}"
          EXTRA=""
          if [ "${GITHUB_REF_NAME}" = "teste" ]; then EXTRA="--prerelease"; fi
          gh release create "v$V" "NoLag-v$V.zip" \
            --title "v$V" \
            --notes-file RELEASE_NOTES.md \
            --target "${GITHUB_REF_NAME}" \
            $EXTRA
